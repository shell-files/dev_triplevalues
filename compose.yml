services:
  frontend:
    container_name: frontend
    image: nginx:1.28
    restart: always
    networks:
      - main-network
    ports:
      - 80:80
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/default.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    container_name: backend
    image: uv:1
    restart: always
    ports:
      # 로컬에서 8000 포트가 사용 중이면 .env 의 BACKEND_PORT 로 변경
      - ${BACKEND_PORT:-8000}:8000
    networks:
      - main-network
    working_dir: /workspace
    volumes:
      - ./backend/src:/workspace/src
      - ./backend/main.py:/workspace/main.py
      - ./backend/esgOntologyTemplate.jsonl:/workspace/esgOntologyTemplate.jsonl
      - ./backend/pyproject.toml:/workspace/pyproject.toml
      - ./backend/uv.lock:/workspace/uv.lock
      - ./backend/.python-version:/workspace/.python-version
      - auth_keys:/workspace/secrets
      - esg_excel:/workspace/esgExcelFiles
      - esg_pdf:/workspace/esgPdfFiles
      - esg_license:/workspace/licenseFiles
      - esg_supporting:/workspace/supportingFiles
      - esg_sample:/workspace/sampleFiles
    environment:
      - HOST_IP=${HOST_IP}
      - DOMAIN=${DOMAIN}
      - KAFKA_SERVER=${KAFKA_SERVER}
      - KAFKA_TOPIC=${KAFKA_TOPIC}
      - KAFKA_SELF_ASSESS_TOPIC=${KAFKA_SELF_ASSESS_TOPIC}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - PUBLIC_KEY=${PUBLIC_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
      - INVITE_TOKEN_EXPIRE_DAYS=${INVITE_TOKEN_EXPIRE_DAYS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB5=${REDIS_DB5}
      - REDIS_DB6=${REDIS_DB6}
      - SERVICE_KEY=${SERVICE_KEY}
      - OCR_KEY_PATH=${OCR_KEY_PATH}
      - MARIA_DB_USER=${MARIA_DB_USER}
      - MARIA_DB_PASSWORD=${MARIA_DB_PASSWORD}
      - MARIA_DB_HOST=${MARIA_DB_HOST}
      - MARIA_DB_DATABASE=${MARIA_DB_DATABASE}
      - MARIA_DB_EXTERNAL=${MARIA_DB_EXTERNAL}
      - MARIA_DB_PORT=${MARIA_DB_PORT}
      - MARIA_DB_KEY=${MARIA_DB_KEY}
      - COOKIE_KEY=${COOKIE_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - AI_MODEL=${AI_MODEL}
      - EMBED_MODEL=${EMBED_MODEL}
      - RERANK_MODEL=${RERANK_MODEL}
      - HF_REPO=${HF_REPO}
    command: [ "uv", "run", "fastapi", "run" ]

networks:
  main-network:
    driver: bridge
    # apache/docker-compose.yaml, pgvector 등 외부 스택이 external 로 참조하는 고정 이름
    name: dev_triplevalues_main-network

volumes:
  auth_keys:
  esg_excel:
  esg_pdf:
  esg_license:
  esg_supporting:
  esg_sample:
